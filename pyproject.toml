[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "nervous_notes_micseydel"
version = "0.0.1"
authors = [
  { name="Michael Seydel", email="contact@micseydel.me" },
]
description = "Personal knowledge management meets the actor model"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/micseydel/nervous_notes"
Issues = "https://github.com/micseydel/nervous_notes/issues"
